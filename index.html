<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unit 6 – Vietnam: Then and Now</title>
<style>
:root{--bg:#fdf3dc;--card:#fffaf0;--ink:#2b2118;--mut:#7a6a58;--pri:#c0392b;--pri2:#8e2a20;--ok:#2e8b57;--bad:#d64541;--line:#e8d5b0;--tile:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d1812;--card:#2a231a;--ink:#f6ead2;--mut:#b9a98f;--pri:#e8604f;--pri2:#c0392b;--line:#4a3d2b;--tile:#352c20}}
:root[data-theme=dark]{--bg:#1d1812;--card:#2a231a;--ink:#f6ead2;--mut:#b9a98f;--pri:#e8604f;--pri2:#c0392b;--line:#4a3d2b;--tile:#352c20}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.5;min-height:100vh}
.skyline{position:fixed;bottom:0;left:0;right:0;font-size:38px;text-align:center;opacity:.35;pointer-events:none;white-space:nowrap;overflow:hidden;letter-spacing:10px}
#app{max-width:720px;margin:0 auto;padding:16px 16px 70px;position:relative}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(28px,7vw,44px);line-height:1.1;margin:.3em 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 4px 0 var(--line)}
button,input{font:inherit;color:inherit}
.btn{background:var(--pri);color:#fff;border:0;border-radius:14px;padding:13px 20px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--pri2);min-height:48px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri2)}
.btn.alt{background:var(--tile);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid #2a7de1;outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--tile);min-height:48px}
.hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700;font-size:15px}
.bar{height:12px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f5a623,var(--pri));transition:width .4s}
.q{font-size:20px;font-weight:600;margin:6px 0 14px}.pic{max-width:100%;max-height:170px;border-radius:12px;border:2px solid var(--line);background:#fff}.big{font-size:64px;text-align:center}
.opt{display:block;width:100%;text-align:left;background:var(--tile);border:2px solid var(--line);border-radius:14px;padding:13px 15px;margin:9px 0;cursor:pointer;min-height:48px;transition:background .2s,transform .2s}
.opt.ok{background:#d6f3e1;border-color:var(--ok);color:#12432a}.opt.bad{background:#fadcdb;border-color:var(--bad);color:#6b1513;animation:sh .4s}
.opt.off{opacity:.3;pointer-events:none}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.tok{display:inline-block;background:var(--tile);border:2px solid var(--line);border-radius:10px;padding:8px 12px;margin:4px;cursor:pointer;min-height:44px}
.zone{min-height:62px;border:2px dashed var(--line);border-radius:14px;padding:6px;margin:8px 0}
.fb{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:16px}.fb.ok{background:#d6f3e1;color:#12432a}.fb.bad{background:#fadcdb;color:#6b1513}
.pop{position:fixed;left:50%;top:30%;font-size:34px;font-weight:800;color:var(--ok);animation:up 1s forwards;pointer-events:none;z-index:9}
@keyframes up{to{transform:translate(-50%,-80px);opacity:0}}
.cf{position:fixed;top:-30px;font-size:26px;animation:fall 1.8s linear forwards;pointer-events:none;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.cat{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:15px}.cat b{width:130px}.cat .bar{flex:1;margin:0}
.chip{display:inline-block;border-radius:20px;padding:2px 10px;background:var(--line);font-size:13px;font-weight:700}
.mode{display:flex;gap:10px}.mode label{flex:1;border:2px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;background:var(--tile)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

// ====== DỮ LIỆU CÂU HỎI (dễ chỉnh sửa) ======
// M(nhóm, độ khó 1-3, câu hỏi, [đáp án], vị trí đúng, giải thích)   – trắc nghiệm / đúng sai / chọn lỗi sai
// F(nhóm, độ khó, câu hỏi, [đáp án chấp nhận], giải thích)          – gõ đáp án
// O(nhóm, độ khó, câu đúng, giải thích)                              – sắp xếp từ
const M=(c,l,q,o,a,e)=>({t:'m',c,l,q,o,a,e}),F=(c,l,q,a,e)=>({t:'f',c,l,q,a,e}),O=(c,l,s,e)=>({t:'o',c,l,s,e});
const CATS={V:'Từ vựng',P:'Past Perfect',A:'Adj + to V / that',R:'Đọc hiểu & điền từ'};
const Q=[
M('V',1,'🌉 Từ nào có nghĩa "cầu vượt"?',['flyover','tram','trench','mushroom'],0,'flyover /ˈflaɪəʊvə(r)/ = cầu vượt.'),
M('V',1,'🚋 Từ nào có nghĩa "xe điện công cộng"?',['trench','tram','flyover','tiled'],1,'tram /træm/ = xe điện. (Sách gốc bị đảo ảnh tram và trench; game đã dùng hình đúng.)'),
M('V',1,'🛖 "Nhà lá" tiếng Anh là gì?',['tiled house','nuclear family','thatched house','trench'],2,'thatched house = nhà lá.'),
M('V',1,'🏡 "Nhà lợp ngói" – từ nào đúng?',['tiled','titled','thatched','slight'],0,'tiled /taɪld/ = lợp ngói. Sách viết nhầm "titled house".'),
M('V',1,'Jane made a ___ improvement in her work. (đáng kể)',['slight','dramatic','manual','tolerant'],1,'dramatic = gây ấn tượng, đáng kể.'),
M('V',1,'The damage was ___. (không đáng kể)',['considerable','significant','slight','dramatic'],2,'slight = nhỏ, không đáng kể.'),
M('V',2,'He is making a ___ recovery. (dần dần)',['gradual','manual','obedient','unprofessional'],0,'gradual = dần dần. Cần có mạo từ "a": a gradual recovery.'),
M('V',1,'Jim is ___ while his brother is not. (vâng lời)',['sympathetic','obedient','tolerant','cooperative'],1,'obedient = vâng lời, ngoan ngoãn.'),
M('V',2,'👨‍👩‍👧 "nuclear family" nghĩa là gì?',['Gia đình nhiều thế hệ','Gia đình hạt nhân (vợ chồng và con)','Gia đình nghèo','Gia đình làm nông'],1,'nuclear family = gia đình chỉ gồm bố mẹ và con cái.'),
M('V',2,'🤝 "sympathetic" nghĩa là gì?',['có lòng đồng cảm','không chuyên nghiệp','bằng tay','nhỏ bé'],0,'sympathetic = có lòng đồng cảm.'),
M('V',2,'🪖 "trench" nghĩa là gì?',['xe điện','cầu vượt','hầm chiến đấu','nhà ngói'],2,'trench /trentʃ/ = hầm chiến đấu.'),
M('V',3,'My mother is very ___ of my mistakes. (khoan dung)',['tolerant','manual','gradual','tiled'],0,'tolerant = khoan dung, chịu đựng được.'),
F('V',2,'The service industry in our country has ___ recently. (phát triển nhanh và mạnh)',['mushroomed'],'mushroom (v) → has mushroomed (hiện tại hoàn thành).'),
F('V',2,'Many people are ___ from obesity nowadays. (chịu đựng)',['suffering'],'be + V-ing: are suffering from.'),
F('V',2,'This company provides numerous ___ jobs for local residents. (lao động chân tay)',['manual'],'manual = bằng tay.'),
M('P',1,'Cấu trúc nào là thì quá khứ hoàn thành?',['S + had + V(p.II)','S + have + V(p.II)','S + was + V-ing','S + V2'],0,'Past Perfect: S + had + V(p.II).'),
M('P',1,'Dấu hiệu nào thường đi với quá khứ hoàn thành?',['tomorrow','by the time','at the moment','next week'],1,'Dấu hiệu: by + mốc quá khứ, before, after, when, by the time, as soon as.'),
F('P',1,'Before hanging out with friends, Jim ___ (do) his homework.',['had done'],'Hành động hoàn tất trước: had done.'),
F('P',1,'Mary said she ___ (never be) to Paris before.',['had never been'],'had never been.'),
F('P',1,'When we came to the movie theater, the film ___ (start).',['had started'],'Phim bắt đầu trước khi chúng tôi đến: had started.'),
F('P',2,'I ___ (live) in Texas for 4 years before I moved to California.',['had lived'],'had lived (xảy ra trước "moved").'),
F('P',2,'Before I got a promotion, I ___ (work) very hard.',['had worked'],'had worked.'),
F('P',2,'Peter admitted he ___ (break) my favorite vase the day before.',['had broken'],'break → broken: had broken.'),
F('P',2,'Yesterday I felt nervous as I ___ (not prepare) my presentation carefully.',['had not prepared',"hadn't prepared"],'Phủ định: had not / hadn\'t + V(p.II).'),
F('P',3,'By the time we arrived at the station, the train ___ (already leave).',['had already left'],'had already left.'),
M('P',2,'After having dinner with my boyfriend, I ___ home.',['had gone','went','have gone','go'],1,'"After having dinner" đã nêu trước-sau, hành động chính chia quá khứ đơn: went.'),
M('P',2,'They ___ any flyovers in our area before 2014.',["didn't build","hadn't built",'haven\'t built','don\'t build'],1,'before 2014 → hadn\'t built.'),
M('P',2,'___ you cleaned your room before you went out?',['Have','Did','Had','Were'],2,'Câu hỏi: Had + S + V(p.II)?'),
M('P',3,'Mr. Brown came home as soon as he ___ his work.',['finished','had finish','finishing','finish'],0,'Bài 2: as soon as + quá khứ đơn → finished.'),
O('P',1,'He had left the house before she came.','Quá khứ hoàn thành (had left) trước quá khứ đơn (came).'),
O('P',2,'Before Peter went to university, he had taken a gap year.','Hành động xảy ra trước: had taken.'),
M('A',1,'It was easy ___ her to pass the exam.',['for','of','that','at'],0,'It + be + adj + for O + to V.'),
M('A',1,'It is impossible ___ a fish to climb a tree.',['of','for','that','to'],1,'It is impossible for a fish to climb a tree.'),
F('A',1,"It's hard ___ that she failed the exam. (2 từ)",['to believe'],"It's hard to believe that..."),
F('A',1,'I was sorry ___ that your father is ill. (2 từ)',['to hear'],'S + be + adj + to V.'),
F('A',1,'I am delighted ___ you passed your exam.',['that'],'adj + that-clause.'),
F('A',2,"They aren't ___ that staying up late is bad for health.",['aware'],'be aware that...'),
M('A',2,'Chọn câu đúng:',['I sure that you have mistaken my pen.',"I'm sure that you have mistaken my pen.",'I sure to you have mistaken my pen.','I am sure to you mistaken my pen.'],1,'Thiếu động từ be: I\'m sure that...'),
M('A',2,'Chọn câu đúng:',['Peter astonished that he found his toy.','Peter was astonished that he found his toy.','Peter astonishing that he found his toy.','Peter is astonish that he found his toy.'],1,'Cần be + astonished.'),
M('A',2,'Mr. Brown was relieved ___ his wife was not injured.',['hearing','hear','to hear','heard'],2,'be relieved + to V.'),
M('A',2,'Is it possible for me ___ this competition?',['winning','to win','win','won'],1,'for O + to V: for me to win.'),
M('A',2,'Peter is not confident ___ his ideas to the class.',['presenting','to present','present','presented'],1,'confident + to V.'),
M('A',2,'___ they able to swim across that river?',['Were','Be','Did','Are be'],0,'be able to: Were they able to...?'),
M('A',3,'"It is difficult for you pass the test." Câu này đúng hay sai?',['Đúng','Sai – phải là "for you to pass"'],1,'Thiếu "to": It is difficult for you to pass.'),
M('A',3,'Viết lại: "Learning English is not difficult for me." → It is not difficult ___.',['for me to learn English','of me learning English','me to learn English','that I learn English'],0,'It + be + adj + for O + to V.'),
M('A',3,'Viết lại: "I had no difficulty in making the last decision." → It was not difficult ___.',['for me to make the last decision','me make the last decision','of me to making the decision','that me made'],0,'It was not difficult for me to make the last decision.'),
O('A',2,"It's interesting for me to go to the museum.",'It + be + adj + for O + to V.'),
O('A',2,'I am sure that he has stolen my bike.','S + be + sure + that-clause.'),
O('A',3,"It's hard to believe that Jim will move house next week.",'It\'s + adj + to V + that-clause.'),
O('A',3,'It is dangerous for children to play with a knife.','It + be + adj + for O + to V.'),
M('R',2,'Bài 11 (1): It is not difficult ___ to imagine how life used to be.',['for me','for my','to me','that I'],0,'It is not difficult for me to imagine...'),
M('R',2,'Bài 11 (5): They were happy ___ their stories with their family.',['shared','sharing','shares','to share'],3,'be happy + to V.'),
M('R',2,'Bài 11 (7): It was very common in those days ___ villagers to gather up.',['to','on','for','that'],2,'It is common for O to V: for villagers to gather.'),
M('R',3,'Bài 12: Plastics have been used for bottles... PVC được dùng từ thập niên 1960 nhưng...',['phù hợp mọi loại nước','không phù hợp đồ uống có ga','chỉ dùng cho chai nhỏ','đã bị thay năm 1982'],1,'Đoạn văn: PVC dùng từ 1960s nhưng không phù hợp đồ uống có gas.'),
M('R',3,'Bài 12: Why is ICI\'s Plastics Division interested in polyester?',['Other products are not selling well','Glass makers lack bottles','They have unused factories','Oil price keeps changing'],0,'Sản phẩm truyền thống bán kém, nên tìm thị trường mới.'),
M('R',3,'Bài 12: Manufacturers think polyester bottles are better than glass because they ___.',['are cheaper','suit small sizes','look exciting','do not break easily'],3,'"virtually unbreakable" – hầu như không vỡ.')

// ====== TRẠNG THÁI & TIỆN ÍCH ======
const $=s=>document.querySelector(s),app=$('#app');
let S={},sound=true,AC;
const shuf=a=>{a=[...a];for(let i=a.length;i--;){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/hadn't/g,'had not').replace(/\s+/g,' ').trim();
const store={get(){try{return +localStorage.getItem('u6best')||0}catch(e){return 0}},set(v){try{localStorage.setItem('u6best',v)}catch(e){}}};
function beep(ok){if(!sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const f=ok?[523,659,784]:[220,165];f.forEach((x,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=x;o.type=ok?'triangle':'sawtooth';g.gain.value=.08;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+i*.12);o.stop(AC.currentTime+i*.12+.14)})}catch(e){}}
function confetti(){for(let i=0;i<24;i++){const s=document.createElement('span');s.className='cf';s.textContent=['🎉','⭐','🌸','✨'][i%4];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2400)}}
function pop(t){const p=document.createElement('div');p.className='pop';p.textContent=t;document.body.appendChild(p);setTimeout(()=>p.remove(),1000)}

// ====== MÀN HÌNH BẮT ĐẦU ======
function home(){
 app.innerHTML=`<h1>Vietnam: Then and Now 🇻🇳</h1><p>Unit 6 – từ vựng có hình minh họa, Past Perfect, Adj + to V / that-clause. ${Q.length} câu, đủ 7 dạng bài.</p>
 <div class="card"><label for="nm"><b>Tên của bạn</b></label><input id="nm" type="text" maxlength="24" placeholder="Nhập tên…" value="${S.name||''}">
 <p><b>Chế độ chơi</b></p><div class="mode"><label><input type="radio" name="md" value="p" checked> Luyện tập<br><small>Không giới hạn thời gian và mạng</small></label>
 <label><input type="radio" name="md" value="t"> Thử thách<br><small>30 giây/câu, 5 mạng ❤️</small></label></div>
 <p>🏆 Điểm cao nhất: <b>${store.get()}</b></p>
 <div class="row"><button class="btn" id="go">Bắt đầu chơi</button><button class="btn alt" id="snd">${sound?'🔊 Âm thanh bật':'🔇 Âm thanh tắt'}</button></div></div>`;
 $('#snd').onclick=()=>{sound=!sound;S.name=$('#nm').value;home()};
 $('#go').onclick=()=>start(Q,$('#nm').value.trim()||'Bạn',document.querySelector('input[name=md]:checked').value);
}
function start(list,name,mode){
 S={name,mode,qs:shuf(list).sort((a,b)=>(a.l||1)-(b.l||1)||0),i:0,score:0,streak:0,best:0,lives:5,st:{},wrong:[],t0:Date.now(),ok:0};
 Object.keys(CATS).forEach(k=>S.st[k]={ok:0,n:0});
 show();
}

// ====== HIỂN THỊ CÂU HỎI ======
function show(){
 clearInterval(S.tm);
 if(S.i>=S.qs.length||(S.mode=='t'&&S.lives<=0))return end();
 const q=S.qs[S.i];q.done=false;q.hint=false;
 const stage=Math.min(5,Math.floor(S.i/(S.qs.length/5))+1);
 app.innerHTML=`<div class="hud"><span>Chặng ${stage}/5</span><span>Câu ${S.i+1}/${S.qs.length}</span><span>⭐ ${S.score}</span><span>🔥 ${S.streak}</span><span>${S.mode=='t'?'❤️'.repeat(Math.max(S.lives,0)):'❤️ ∞'}</span>${S.mode=='t'?'<span id="tm">⏱ 30</span>':''}</div>
 <div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div>
 <div class="card"><span class="chip">${CATS[q.c]||'Ôn tập'} · ${['','Dễ','Vừa','Khó'][q.l||1]}</span><div id="qb"></div><div id="fb"></div>
 <div class="row" style="margin-top:12px"><button class="btn alt" id="hint">💡 50/50 (−5)</button><button class="btn alt" id="skip">Bỏ qua</button></div></div>`;
 const qb=$('#qb');
 if(q.t=='m'){
  q.opts=shuf(q.o.map((x,i)=>({x,r:i==q.a})));
  const em=(q.q.match(/^(\p{Extended_Pictographic}\S*)\s/u)||[])[1];
  qb.innerHTML=(q.img?`<div style="text-align:center"><img class="pic" src="${IMG[q.img]}" alt=""></div>`:em?`<div class="big">${em}</div>`:'')+`<div class="q">${q.q.replace(em||'','')}</div>`+q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.x}</button>`).join('');
  qb.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answerM(+b.dataset.i));
 }else if(q.t=='f'){
  qb.innerHTML=`<div class="q">${q.q}</div><input type="text" id="fi" autocomplete="off" autocapitalize="off" placeholder="Gõ đáp án…"><div style="margin-top:10px"><button class="btn" id="ck">Kiểm tra</button></div>`;
  $('#ck').onclick=()=>finish(q.a.some(a=>norm(a)==norm($('#fi').value)));
  $('#fi').onkeydown=e=>{if(e.key=='Enter')$('#ck').click()};$('#fi').focus();
  $('#hint').style.display='none';
 }else{
  const toks=q.s.split(' ');q.pool=shuf(toks.map((w,i)=>({w,i})));q.pick=[];
  qb.innerHTML=`<div class="q">Sắp xếp các từ thành câu đúng:</div><div class="zone" id="zn"></div><div id="pl"></div><div style="margin-top:10px"><button class="btn" id="ck">Kiểm tra</button></div>`;
  drawO();$('#ck').onclick=()=>{if(!q.done)finish(q.pick.map(t=>t.w).join(' ')==q.s)};$('#hint').style.display='none';
 }
 $('#hint').onclick=()=>{if(q.t!='m'||q.done||q.hint)return;q.hint=true;S.score=Math.max(0,S.score-5);let n=0;qb.querySelectorAll('.opt').forEach((b,i)=>{if(!q.opts[i].r&&n<2){b.classList.add('off');n++}})};
 $('#skip').onclick=()=>{if(!q.done){S.st[q.c]&&S.st[q.c].n++;S.wrong.push(q);S.streak=0;S.i++;show()}};
 if(S.mode=='t'){S.left=30;S.tm=setInterval(()=>{S.left--;const t=$('#tm');if(t)t.textContent='⏱ '+S.left;if(S.left<=0){clearInterval(S.tm);if(!q.done)finish(false,true)}},1000)}
}
function drawO(){const q=S.qs[S.i];
 $('#zn').innerHTML=q.pick.map(t=>`<button class="tok" data-i="${t.i}">${t.w}</button>`).join('');
 $('#pl').innerHTML=q.pool.filter(t=>!q.pick.includes(t)).map(t=>`<button class="tok" data-i="${t.i}">${t.w}</button>`).join('');
 document.querySelectorAll('.tok').forEach(b=>b.onclick=()=>{if(q.done)return;const t=q.pool.find(x=>x.i==b.dataset.i);const k=q.pick.indexOf(t);k<0?q.pick.push(t):q.pick.splice(k,1);drawO()});
}
function answerM(i){const q=S.qs[S.i];if(q.done)return;
 const bs=document.querySelectorAll('.opt');bs.forEach((b,k)=>{if(q.opts[k].r)b.classList.add('ok');else if(k==i)b.classList.add('bad')});
 finish(q.opts[i].r);
}

// ====== CHẤM ĐIỂM & HIỆU ỨNG ======
function finish(ok,timeout){
 const q=S.qs[S.i];if(q.done)return;q.done=true;clearInterval(S.tm);
 const st=S.st[q.c];if(st){st.n++;}
 let ans=q.t=='m'?q.o[q.a]:q.t=='f'?q.a[0]:q.s;
 if(ok){
  S.streak++;S.best=Math.max(S.best,S.streak);S.ok++;if(st)st.ok++;
  const g=10*(q.l||1)+(S.mode=='t'?Math.max(0,S.left/3|0):0)+Math.min(S.streak,5)*2;
  S.score+=g;beep(true);confetti();pop('+'+g);
 }else{
  S.streak=0;S.wrong.push(q);if(S.mode=='t')S.lives--;beep(false);
  if(q.t=='f'){const i=$('#fi');if(i)i.style.borderColor='var(--bad)'}
  if(q.t=='o'){const z=$('#zn');z.style.animation='sh .4s';z.style.borderColor='var(--bad)'}
 }
 $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'✅ Chính xác!':(timeout?'⏰ Hết giờ!':'❌ Chưa đúng.')}</b>${ok?'':' Đáp án: <b>'+ans+'</b>'}<br>${q.e}</div><div style="margin-top:12px"><button class="btn" id="nx">Câu tiếp theo</button></div>`;
 $('#nx').onclick=()=>{S.i++;show()};$('#nx').focus();
}

// ====== MÀN HÌNH TỔNG KẾT ======
function end(){
 clearInterval(S.tm);
 const n=S.i,acc=n?Math.round(S.ok/n*100):0,sec=Math.round((Date.now()-S.t0)/1000);
 const title=acc>=90?'🏅 Bậc thầy ngữ pháp':acc>=75?'🥇 Giỏi':acc>=50?'🥈 Khá':'🥉 Tập sự';
 const nb=S.score>store.get();if(nb)store.set(S.score);
 app.innerHTML=`<h1>${title}</h1><p>${S.name}, bạn đã hoàn thành Unit 6!${nb?' 🎉 <b>Kỷ lục mới!</b>':''}</p>
 <div class="card"><div class="hud"><span>⭐ ${S.score} điểm</span><span>✅ ${S.ok} đúng</span><span>❌ ${n-S.ok} sai</span><span>🎯 ${acc}%</span><span>⏱ ${Math.floor(sec/60)}p${sec%60}s</span><span>🔥 Chuỗi dài nhất: ${S.best}</span></div></div>
 <div class="card"><b>Kết quả theo dạng bài</b>${Object.keys(CATS).map(k=>{const s=S.st[k];const p=s.n?Math.round(s.ok/s.n*100):0;return `<div class="cat"><b>${CATS[k]}</b><div class="bar"><i style="width:${p}%"></i></div><span>${s.ok}/${s.n}</span></div>`}).join('')}</div>
 <div class="card"><b>Các câu cần ôn (${S.wrong.length})</b>${S.wrong.map(q=>`<p>• ${q.t=='o'?q.s:q.q}<br><small>👉 ${q.t=='m'?q.o[q.a]:q.t=='f'?q.a[0]:q.s} – ${q.e}</small></p>`).join('')||'<p>Không có câu sai. Tuyệt vời! 🌟</p>'}</div>
 <div class="row"><button class="btn" id="again">Chơi lại</button>${S.wrong.length?'<button class="btn alt" id="rev">Ôn lại câu sai</button>':''}<button class="btn alt" id="hm">Về trang đầu</button></div>`;
 $('#again').onclick=()=>start(Q,S.name,S.mode);
 const r=$('#rev');if(r)r.onclick=()=>start(S.wrong,S.name,'p');
 $('#hm').onclick=home;
 if(acc>=75)confetti();
}
home();
